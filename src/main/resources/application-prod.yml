spring:
  datasource:
    url: ${MONAGENT_DATASOURCE_URL}
    username: ${MONAGENT_DATASOURCE_USERNAME}
    password: ${MONAGENT_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate.jdbc.batch_size: ${MONAGENT_JPA_BATCH_SIZE:50}
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true

monagent:
  runtime:
    timezone: ${MONAGENT_TIMEZONE:UTC}
  integrations:
    ollama:
      base-url: ${MONAGENT_OLLAMA_BASE_URL}
      model: ${MONAGENT_OLLAMA_MODEL:llama3.1:8b-instruct}
      request-timeout-seconds: ${MONAGENT_OLLAMA_TIMEOUT_SECONDS:30}
      retry-attempts: ${MONAGENT_OLLAMA_RETRY_ATTEMPTS:3}
      circuit-breaker-failure-threshold: ${MONAGENT_OLLAMA_CIRCUIT_BREAKER_FAILURE_THRESHOLD:50}
      bulkhead-max-concurrent-calls: ${MONAGENT_OLLAMA_BULKHEAD_MAX_CONCURRENT_CALLS:2}
